name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify public artifact
        run: |
          node scripts/build-public-site.mjs
          node scripts/verify-public-site.mjs _site

      - name: Verify private local and cloud artifacts
        run: |
          npm run build:private
          npm run verify:private
          npm run build:private:cloud
          npm run verify:private:cloud

      - name: Build Cloudflare Pages Functions
        run: npx wrangler pages functions build --outdir .wrangler/functions-build

      - name: Run unit tests
        run: npm test

      - name: Scan tracked files for common secret formats
        run: node scripts/check-tracked-secrets.mjs

      - name: Validate inline JavaScript syntax
        run: >-
          node scripts/check-inline-scripts.mjs
          public-site/index.html
          public-site/404.html
          guitar-learning/index.html
          space-game/index.html
          typing-trainer/index.html
          library/index.html
          running-app/index.html
          running-app/today.html
          running-app/log.html
          running-app/dashboard.html
          running-app/calendar.html
          running-app/strava.html
          running-app/tests.html
          coffee-shop/index.html
